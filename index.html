  //           upgrade 主角獲得 N 個隨機提升 / buff 獲得 N 個隨機祝福
  events: [
    { title: '神秘泉水', text: '清澈的泉水閃著微光。', options: [
      { label: '喝下去：全隊回復 30% HP', effects: { healPct: 0.3 } },
      { label: '浸泡全身：主角最大 HP +4', effects: { maxHp: 4 } } ] },
    { title: '賭徒', text: '一個老人搖著骰盅：「拿點血來賭一把？」', options: [
      { label: '割血下注：失去 6 HP，獲得 1 件隨機裝備', effects: { loseHp: 6, equip: 1 } },
      { label: '不賭，離開', effects: {} } ] },
    { title: '訓練場', text: '一座廢棄的訓練場，木人樁還能用。', options: [
      { label: '苦練：失去 3 HP，主角獲得 1 個隨機提升', effects: { loseHp: 3, upgrade: 1 } },
      { label: '休息：全隊回復 15% HP', effects: { healPct: 0.15 } } ] },
    { title: '流浪祭司', text: '祭司願意為你們祈福。', options: [
      { label: '接受祈福：獲得 1 個隨機祝福', effects: { buff: 1 } },
      { label: '請他治療：全隊回復 20% HP', effects: { healPct: 0.2 } } ] },
    { title: '鐵匠', text: '路邊的鐵匠正在打鐵：「幫你磨一磨？」', options: [
      { label: '請他幫忙：失去 4 HP，主角獲得 1 個隨機提升', effects: { loseHp: 4, upgrade: 1 } },
      { label: '道謝離開：全隊回復 10% HP', effects: { healPct: 0.1 } } ] },
  ],

  // ---------- 敵人 AI ----------
  ai: {
    level: 'smart',     // 預設難度（主頁「遊戲設定」可以切換）：'easy' 隨機 / 'normal' 偏好組合 / 'smart' 會讀牌
    comboWeight: 2,     // normal：排序權重 = 1 + comboWeight × 組合銜接數
    smart: {
      // 聰明：用你「還沒出現過的牌」（牌庫＋手牌＋已排的牌，它不知道哪張在哪）估計你出各類型的機率，出剋制的
      comboValue: 0.5,  // 組合銜接的加分
      finishHp: 8,      // 你的 HP 低於這個值時，偏好進攻
      lowHp: 0.35,      // 牠自己的 HP 低於這個比例時，偏好防禦、閃避
      temperature: 0.3, // 越小越死板（總是選最佳），越大越隨機
    },
  },
  ui: {
    flipDelay: 650,     // 翻牌後到結算的停頓（毫秒）
    slotDelay: 1000,    // 每格結算後到下一格的停頓（毫秒）
    supportDelay: 700,  // 每張輔助卡掀開的停頓（毫秒）
    fastFactor: 0.25,   // 「快速」模式的時間倍率
    bigHit: 5,          // 傷害達到多少會震動畫面（手機會震動）
  },
};
</script>
<style>

  .colhdr { font-size: 11px; color: var(--muted); align-self: end; text-align: center; line-height: 1.3; }

  .hpbox { grid-row: 1; align-self: end; font-size: 11px; text-align: center; font-weight: 700; }

  /* ---------- 彈窗 ---------- */

    .hand { gap: 3px; } .arena { gap: 4px; grid-template-columns: minmax(0,1fr) 52px 52px minmax(0,1fr); }
    .card { padding: 3px; } .card .nm { font-size: 12px; } .card .ef { font-size: 8.5px; }
    .sbtn { padding: 5px 6px; font-size: 11px; }
    .suprow { grid-template-columns: 38px repeat(4, minmax(0,1fr)); }
  }
  @media (min-width: 560px) {
    .card { min-height: 96px; } .hand .card { min-height: 104px; }
    .card .nm { font-size: 15px; } .card .ef { font-size: 11px; }
  }
  @media (min-width: 900px) {
    #app { max-width: 1040px; }
    #homeScreen, #setupScreen, #deckScreen, #mapScreen, #hubScreen { max-width: 480px; margin: 0 auto; }
    .gamecols { display: grid; grid-template-columns: 480px 1fr; gap: 16px; align-items: start; }
    .gside { position: sticky; top: 8px; }
    .gside .loghead { margin-top: 0; }
    #log { max-height: calc(100vh - 60px); }
    .arena { grid-template-columns: minmax(0,1fr) 80px 80px minmax(0,1fr); }
    .fighter .glyph { font-size: 40px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 主頁 -->
  <div id="homeScreen">
    <div class="hero"><div class="logo">⚔️🃏</div><h1>卡牌對決</h1><div class="sub">攻擊 &gt; 技巧 &gt; 防禦 &gt; 攻擊・三格同時翻牌</div></div>
    <div class="modes" id="modeList"></div>
    <div class="homebtns">
      <button onclick="showDecks()">🃏 牌組設定</button>
      <button onclick="showSettings()">⚙️ 遊戲設定</button>
      <button onclick="showRules()">📖 規則說明</button>
    </div>
  </div>

  <!-- 模式設定：選角色等 -->
  <div id="setupScreen" class="hidden">
    <div class="topbar"><button class="sbtn" onclick="goHome()">← 主頁</button><span class="turn" id="setupTitle"></span></div>
    <div id="setupBody"></div>
    <button class="bigbtn" id="setupStart"></button>
  </div>

  <!-- 牌組設定 -->
  <div id="deckScreen" class="hidden">
    <div class="topbar"><button class="sbtn" onclick="goHome()">← 主頁</button><span class="turn">牌組設定</span></div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">每個角色都有戰鬥牌組（當主角時用）和輔助牌組（當輔助時用），沒設定就用預設。</div>
    <div class="decklist" id="deckList"></div>
  </div>

  <!-- 冒險地圖 -->
  <div id="mapScreen" class="hidden">
    <div class="topbar">
      <span class="turn" id="mapTitle"></span>
      <button class="sbtn" onclick="showRunDecks()">牌組</button>
      <button class="sbtn" onclick="goHome()">主頁</button>
      <button class="sbtn" onclick="confirmQuit()">放棄</button>
    </div>
    <div class="party" id="mapParty"></div>
    <div class="gear" id="mapGear"></div>
    <svg id="mapSvg"></svg>
    <div class="legend">⚔️ 怪物　💀 精英　❤️ 回血　✨ 祝福　🔄 換卡　🎁 寶箱　❓ 事件　👑 王<br>點發光的點前進。打普通怪可以提升主角，精英、寶箱、王可以拿裝備。進度會自動保存。</div>
  </div>

  <!-- 守護、王者連戰的據點 -->
  <div id="hubScreen" class="hidden">
    <div class="topbar">
      <span class="turn" id="hubTitle"></span>
      <button class="sbtn" onclick="showRunDecks()">牌組</button>
      <button class="sbtn" onclick="goHome()">主頁</button>
      <button class="sbtn" onclick="confirmQuit()">放棄</button>
    </div>
    <div class="party" id="hubParty"></div>
    <div class="gear" id="hubGear"></div>
    <div id="hubBody"></div>
    <button class="bigbtn" id="hubGo"></button>
  </div>

  <!-- 戰鬥 -->
  <div id="gameScreen" class="hidden">
    <div class="topbar">
      <span class="turn" id="turnLbl"></span>
      <button class="sbtn" onclick="showPiles()">棄牌堆</button>
      <button class="sbtn" onclick="showRules()">規則</button>
      <button class="sbtn" id="speedBtn" onclick="toggleSpeed()">速度 1x</button>
    </div>
    <div class="gamecols"><div class="gmain">
    <div id="guardBar" class="hidden"></div>
    <div id="arenaWrap"><div class="arena" id="board"></div><div id="fx"></div></div>
    <div class="supports" id="supports"></div>
    <div class="energy" id="energy"></div>
    <div class="hand" id="hand"></div>
    <div class="hint" id="hint"></div>
    <button class="actbtn" id="actBtn"></button>
    </div><div class="gside">
    <div class="loghead"><b>戰鬥紀錄</b><button class="sbtn" onclick="copyLog()">複製全部紀錄</button></div>
    <div id="log"></div>
    </div></div>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
// =====================================================================
//  共用
// =====================================================================
const TYPES = {
  attack:  { label: '攻擊', beats: 'skill',   cls: 'tA' },
  skill:   { label: '技巧', beats: 'defense', cls: 'tS' },
  defense: { label: '防禦', beats: 'attack',  cls: 'tD' },
  dodge:   { label: '閃避', beats: null,      cls: 'tG' },
};
const CLASH = { higher: '比威力', mutual: '互相傷害', diff: '高減低' };
const AI_LEVEL = { easy: '簡單（隨機）', normal: '普通（偏好組合）', smart: '聰明（會讀牌）' };
const COND = { prevHit: '前格命中', prevBlock: '前格擋下', prevDodge: '前格閃避成功' };
const NODE_ICON = { monster: '⚔️', elite: '💀', heal: '❤️', buff: '✨', swap: '🔄', treasure: '🎁', event: '❓', boss: '👑' };
const NODE_NAME = { monster: '怪物', elite: '精英', heal: '回血', buff: '祝福', swap: '換卡', treasure: '寶箱', event: '事件', boss: '王' };
const sg = n => n >= 0 ? `+${n}` : `−${-n}`;
const MOD_TEXT = {
  powAll: n => `所有卡威力 ${sg(n)}`, powAtk: n => `攻擊卡威力 ${sg(n)}`, powSkl: n => `技巧卡威力 ${sg(n)}`, powDef: n => `防禦卡威力 ${sg(n)}`,
  slot1: n => `第 1 格威力 ${sg(n)}`, counter: n => `擋下反擊 ${sg(n)}`, dodge: n => `閃避率 ${sg(n)}%`,
  armor: n => `受到傷害 −${n}`, lifesteal: n => `命中時回復 ${n}`, thorns: n => `被命中時反彈 ${n}`,
  comboDmg: n => `連擊第 2 段起，每段 +${n} 傷害`, lowHpPow: n => `HP ≤ 50% 時所有威力 +${n}`,
  energy1: n => `第 1 回合能量 +${n}`, killHeal: n => `擊敗敵人後回復 ${n}`, maxHp: n => `最大 HP +${n}`,
  speed: n => `速度 +${n}`, regen: n => `每回合結束回復 ${n}`, enrage: n => `每回合威力 +${n}（累加）`,
  heal: n => `回復 ${n} HP`, shield: n => `護盾 ${n}`, dmg: n => `直接造成 ${n} 傷害`,
  weaken: n => `敵方所有威力 −${n}`, selfDmg: n => `自己失去 ${n} HP`,
};
const modText = m => Object.entries(m || {}).filter(([, n]) => n).map(([k, n]) => MOD_TEXT[k](n)).join('，');
const $ = s => document.querySelector(s);
const def = key => CONFIG.cards[key];
const sdef = key => CONFIG.supportCards[key];
const bump = (o, k, n = 1) => { o[k] = (o[k] || 0) + n; };
const pickN = (arr, n) => shuffle(arr.slice()).slice(0, n);
const rand = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weighted(w) { const e = Object.entries(w).filter(([, v]) => v > 0); let r = Math.random() * e.reduce((a, [, v]) => a + v, 0); for (const [k, v] of e) { r -= v; if (r <= 0) return k; } return e[e.length - 1][0]; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms * (SET.fast ? CONFIG.ui.fastFactor : 1))); }
function condMet(cond, prev) { return { prevHit: 'hit', prevBlock: 'block', prevDodge: 'dodge' }[cond] === prev; }
function store(key, val) { try { if (val === undefined) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }

// 設定（記在瀏覽器）
const SET = Object.assign({ attackClash: CONFIG.attackClash, aiLevel: CONFIG.ai.level, intent: false, fast: false, vibrate: true }, load('cardDuel.settings', {}));
CONFIG.attackClash = SET.attackClash;
function saveSettings() { CONFIG.attackClash = SET.attackClash; store('cardDuel.settings', SET); }

function effText(d, short) {
  const t = [];
  if (d.combo) t.push(short ? `${COND[d.combo.cond]} +${d.combo.bonus}` : `${COND[d.combo.cond]}時威力 +${d.combo.bonus}`);
  if (d.counterOnWin != null) t.push(short ? `勝利時反擊 ${d.counterOnWin}` : `勝利時反擊改為 ${d.counterOnWin}`);
  if (d.dodgeChance != null) { const pct = Math.round(d.dodgeChance * 100), vs = d.dodgeSkill ? '攻擊或技巧' : '攻擊';
    t.push(short ? `可躲${d.dodgeSkill ? '攻擊、技巧' : '攻擊'}` : `對手出${vs}時擲骰，${pct}% 機率完全閃開；失敗則被命中`); }
  if (d.breakOnWin) t.push(short ? `破防 −${d.breakOnWin}` : `勝過防禦時，破防改為對手下一格威力 −${d.breakOnWin}`);
  if (d.onWinNextAttackBonus) t.push(short ? `勝利後下格攻擊 +${d.onWinNextAttackBonus}` : `勝利後自己下一格攻擊卡威力 +${d.onWinNextAttackBonus}`);
  return t.join('；');
}
function cardLabel(key) { const d = def(key); return `<span class="${TYPES[d.type].cls}">${d.name}［${TYPES[d.type].label}］</span>`; }
function supLabel(key) { return `<span class="tU">${sdef(key).name}［輔助］</span>`; }
function cardDesc(k) { const d = def(k); return `費${d.cost}｜${d.dodgeChance != null ? `閃避率 ${Math.round(d.dodgeChance * 100)}%` : `威力${d.power}`}${effText(d) ? '｜' + effText(d) : ''}`; }
function cardLine(k) { return `${cardLabel(k)} ${cardDesc(k)}`; }
function supLine(k) { return `${supLabel(k)}｜${modText(sdef(k).mods)}`; }
function cardHTML(key, extra = '', inner = '') {
  const d = def(key);
  if (d.type === 'dodge') inner = inner.replace(/<span class="final">.*?<\/span>/, '');
  return `<div class="card ${d.type} ${extra}"><div class="ctop"><span class="cost">${d.cost}</span><span class="ty">${TYPES[d.type].label}</span></div>
    <div class="nm">${d.name}</div><div class="pw">${d.dodgeChance != null ? `閃避 <b>${Math.round(d.dodgeChance * 100)}%</b>` : `威力 <b>${d.power}</b>`}</div><div class="ef">${effText(d, true)}</div>${inner}</div>`;
}
function supCardHTML(key, extra = '') {
  return `<div class="card support ${extra}"><div class="ctop"><span class="ty">輔助</span></div><div class="nm">${sdef(key).name}</div><div class="ef">${modText(sdef(key).mods)}</div></div>`;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
const SCREENS = ['#homeScreen', '#setupScreen', '#deckScreen', '#mapScreen', '#hubScreen', '#gameScreen'];
function showScreen(id) { SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }

// =====================================================================
//  牌組（戰鬥＋輔助），自訂的存在瀏覽器
// =====================================================================
const DECK_KIND = {
  battle:  { label: '戰鬥', pool: k => [...CONFIG.commonCards, ...CONFIG.characters[k].cards], min: () => CONFIG.deckSize, max: () => CONFIG.deckSize,
             def: k => ({ ...CONFIG.characters[k].defaultDeck }), label1: cardLabel, desc: cardDesc, typeOf: k => def(k).type, name: k => def(k).name },
  support: { label: '輔助', pool: k => [...CONFIG.commonSupport, ...CONFIG.characters[k].support], min: () => CONFIG.supportDeckMin, max: () => CONFIG.supportDeckMax,
             def: k => { const d = { ...CONFIG.defaultSupportCommon }; CONFIG.characters[k].support.forEach(s => d[s] = 2); return d; },
             label1: supLabel, desc: k => modText(sdef(k).mods), typeOf: () => 'support', name: k => sdef(k).name },
};
const deckCount = d => Object.values(d).reduce((a, b) => a + b, 0);
function deckValid(kind, charKey, d) {
  const K = DECK_KIND[kind], pool = K.pool(charKey), n = deckCount(d);
  return n >= K.min() && n <= K.max() && Object.entries(d).every(([k, c]) => pool.includes(k) && c >= 0 && c <= CONFIG.maxCopies);
}
const savedDecks = Object.assign({ battle: {}, support: {} }, load('cardDuel.decks2', {}));
function deckFor(kind, charKey) {
  const d = savedDecks[kind][charKey];
  return d && deckValid(kind, charKey, d) ? { ...d } : DECK_KIND[kind].def(charKey);
}
const deckSummary = (kind, d) => Object.entries(d).filter(([, n]) => n > 0).map(([k, n]) => `${DECK_KIND[kind].name(k)}×${n}`).join('、');

// =====================================================================
//  一趟遊戲（RUN）：隊伍、裝備、祝福、統計；各模式共用
// =====================================================================
let RUN = null;
const equipSum = k => RUN ? RUN.equipment.reduce((s, e) => s + (CONFIG.equipment[e].mods[k] || 0), 0) : 0;
const charMaxHp = c => c.ch.hp + (c.ups.maxHp || 0) + equipSum('maxHp');
const charSpeed = c => c.ch.speed + (c.ups.speed || 0) + RUN.buffs.reduce((s, b) => s + (CONFIG.buffs[b.key].mods.speed || 0), 0);
const mainChar = () => RUN.party[RUN.main];
function newCharState(key) {
  const ch = CONFIG.characters[key];
  return { key, ch, hp: ch.hp + equipSum('maxHp'), ups: {}, upNames: [], battle: deckFor('battle', key), support: deckFor('support', key) };
}
function healChar(c, n) { const before = c.hp; c.hp = Math.min(charMaxHp(c), c.hp + n); return c.hp - before; }
function newStats() { return { use: {}, dmg: {}, eff: {}, sup: {}, supDmg: 0, hits: 0, blocks: 0, breaks: 0, dodges: 0, dmgDealt: 0, dmgTaken: 0, shuffles: 0 }; }
function mergeStats(into, s) {
  ['use', 'dmg', 'sup'].forEach(k => Object.entries(s[k]).forEach(([c, n]) => bump(into[k], c, n)));
  Object.entries(s.eff).forEach(([c, e]) => { const t = into.eff[c] || (into.eff[c] = { ok: 0, miss: 0 }); t.ok += e.ok; t.miss += e.miss; });
  ['supDmg', 'hits', 'blocks', 'breaks', 'dodges', 'dmgDealt', 'dmgTaken', 'shuffles'].forEach(k => into[k] += s[k]);
}
function newRun(mode, partyKeys) {
  G = null;
  RUN = { mode, party: [], main: 0, equipment: [], buffs: [], over: false, won: false, stats: newStats(), battles: 0, kills: 0, maxCombo: 0, history: [], start: partyKeys.slice() };
  partyKeys.forEach(k => RUN.party.push(newCharState(k)));
  $('#log').innerHTML = '';
  log(`<div class="le battle">${MODES[mode].icon} ${MODES[mode].name}開始：${RUN.party.map(c => c.ch.name).join('、')}｜攻擊對攻擊＝${CLASH[CONFIG.attackClash]}・敵人 AI＝${AI_LEVEL[SET.aiLevel]}</div>`);
}
// 存檔：只在地圖、據點畫面存（戰鬥中重新整理會回到戰鬥前）
function saveRun() { if (RUN && !RUN.over && MODES[RUN.mode].save) store('cardDuel.save', { v: 1, run: JSON.parse(JSON.stringify(RUN, (k, v) => k === 'ch' ? undefined : v)) }); }
function clearSave() { store('cardDuel.save', undefined); }
function loadSave() {
  const s = load('cardDuel.save', null);
  if (!s || s.v !== 1 || !MODES[s.run.mode] || s.run.party.some(c => !CONFIG.characters[c.key])) return null;
  s.run.party.forEach(c => c.ch = CONFIG.characters[c.key]);
  return s.run;
}
function resumeRun() {
  const r = loadSave(); if (!r) return goHome();
  G = null; RUN = r;
  $('#log').innerHTML = '';
  log(`<div class="le battle">繼續${MODES[RUN.mode].name}：${RUN.party.map(c => c.ch.name).join('、')}</div>`);
  MODES[RUN.mode].resume();
}
// 紀錄
const records = load('cardDuel.records', {});
function recordRun(score, text) {
  const r = records[RUN.mode] || (records[RUN.mode] = { plays: 0, wins: 0, best: -1, bestText: '' });
  r.plays++; if (RUN.won) r.wins++;
  if (score > r.best) { r.best = score; r.bestText = text; }
  store('cardDuel.records', records);
}

// ---------- 共用的成長、選項彈窗 ----------
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.remove('hidden'); $('#modal').scrollTop = 0; }
function closeModal() { $('#modal').classList.add('hidden'); edit = null; }
let CHOICES = [];   // [{ title, desc, fn }]：點了就關掉彈窗並執行 fn
function choiceModal(title, text, opts, extra = '') {
  CHOICES = opts;
  openModal(`<h3>${title}</h3>${text ? `<div style="font-size:13px;margin-bottom:10px;line-height:1.6">${text}</div>` : ''}
    <div class="choices">${opts.map((o, i) => `<button class="choice" data-choice="${i}"><b>${o.title}</b>${o.desc ? `<div>${o.desc}</div>` : ''}</button>`).join('')}</div>${extra}`);
}
$('#mbox').addEventListener('click', e => {
  const b = e.target.closest('[data-choice]');
  if (b) { const o = CHOICES[+b.dataset.choice]; CHOICES = []; closeModal(); o.fn(); }
});
function healAll(pct) { return RUN.party.map(c => `${c.ch.name} +${healChar(c, Math.round(charMaxHp(c) * pct))}`).join('、'); }
function gainEquip(k) {
  RUN.equipment.push(k);
  const mh = CONFIG.equipment[k].mods.maxHp; if (mh) RUN.party.forEach(c => c.hp += mh);
  log(`<div class="le sys">獲得裝備 ${CONFIG.equipment[k].icon}${CONFIG.equipment[k].name}（${modText(CONFIG.equipment[k].mods)}）</div>`);
}
function gainUpgrade(c, k) {
  const m = CONFIG.upgrades[k].mods;
  Object.entries(m).forEach(([x, n]) => bump(c.ups, x, n));
  if (m.maxHp) c.hp += m.maxHp;
  c.upNames.push(CONFIG.upgrades[k].name);
  log(`<div class="le sys">${c.ch.name} 提升：${CONFIG.upgrades[k].name}（${modText(m)}）</div>`);
}
function gainBuff(k) { RUN.buffs.push({ key: k, left: CONFIG.buffBattles }); log(`<div class="le sys">祝福：${CONFIG.buffs[k].name}（${modText(CONFIG.buffs[k].mods)}，${CONFIG.buffBattles} 場）</div>`); }
const freeEquip = () => Object.keys(CONFIG.equipment).filter(k => !RUN.equipment.includes(k));
const equipOpt = (k, then) => ({ title: `${CONFIG.equipment[k].icon} ${CONFIG.equipment[k].name}`, desc: modText(CONFIG.equipment[k].mods), fn: () => { gainEquip(k); then(); } });
const upgradeOpt = (k, then) => ({ title: `⬆️ ${CONFIG.upgrades[k].name}`, desc: `主角 ${mainChar().ch.name}：${modText(CONFIG.upgrades[k].mods)}（永久）`, fn: () => { gainUpgrade(mainChar(), k); then(); } });
function equipChoices(title, text, then, extra = '') {
  const opts = pickN(freeEquip(), 3).map(k => equipOpt(k, then));
  if (!opts.length) return choiceModal(title, text + '裝備已經拿光了。', [{ title: '繼續', fn: then }], extra);
  choiceModal(title, text + '選一件裝備（全隊共用）。', opts, extra);
}
function upgradeChoices(title, text, then, extra = '') {
  choiceModal(title, `${text}選一個提升給主角 ${mainChar().ch.name}（永久）。`, pickN(Object.keys(CONFIG.upgrades), 3).map(k => upgradeOpt(k, then)), extra);
}
function recruit(text, then) {
  const pool = Object.keys(CONFIG.characters).filter(k => !RUN.party.some(c => c.key === k));
  choiceModal('🤝 招募夥伴', `${text}角色池 ${pool.length} 位中隨機抽 3 位，選 1 位加入隊伍。`,
    pickN(pool, 3).map(k => { const ch = CONFIG.characters[k]; return { title: `${ch.name}（HP ${ch.hp}・速度 ${ch.speed}）`,
      desc: `${ch.cards.map(cardLine).join('<br>')}<br>${ch.support.map(supLine).join('<br>')}`,
      fn: () => { RUN.party.push(newCharState(k)); log(`<div class="le sys">${ch.name} 加入隊伍</div>`); chooseMain(then); } }; }));
}
function chooseMain(then) {
  choiceModal('選擇主角', '主角出 3 張戰鬥卡、承受傷害；其他人當輔助，每回合各出 1 張輔助卡。',
    RUN.party.map((c, i) => ({ title: `${c.ch.name}${i === RUN.main ? '（目前主角）' : ''}`, desc: `HP ${c.hp}/${charMaxHp(c)}・速度 ${charSpeed(c)}${c.upNames.length ? '・提升：' + c.upNames.join('、') : ''}`,
      fn: () => { RUN.main = i; log(`<div class="le sys">主角：${c.ch.name}</div>`); then(); } })));
}
function partyHTML() {
  return RUN.party.map((c, i) => {
    const mx = charMaxHp(c), pct = c.hp / mx * 100;

// 怪物規格：key、HP、威力加成（實際生成在 makeMonster）
function monsterSpec(key, tier, step, elite) {
  const md = CONFIG.monsters[key], S = CONFIG.scaling;
  const boss = CONFIG.maps.some(m => m.boss === key);
  if (boss) step = 0;
  return { key, tier, elite: !!elite, boss,
    hp: Math.round(md.hp * (1 + S.hpPerStep * step) * (elite ? S.eliteHp : 1)),
    pow: CONFIG.maps[tier].powBonus + Math.floor(step / S.powEverySteps) + (elite ? S.elitePow : 0) };
}

// =====================================================================
//  冒險地圖：隨機路徑（類似殺戮尖塔），不交叉
// =====================================================================
function genMap(mi) {
  const M = CONFIG.mapGen, C = M.columns, S = M.steps - 1;   // S＝一般步數（不含王）
  const has = Array.from({ length: S }, () => Array(C).fill(false));
  const edges = Array.from({ length: S - 1 }, () => Array.from({ length: C }, () => []));
  const nPaths = M.pathsMin + Math.floor(Math.random() * (M.pathsMax - M.pathsMin + 1));
  const startCols = shuffle([...Array(C).keys()]);
  for (let p = 0; p < nPaths; p++) {
    let c = p < 2 ? startCols[p] : Math.floor(Math.random() * C);
    for (let s = 0; s < S; s++) {
      has[s][c] = true;
      if (s === S - 1) break;
      let nc = Math.max(0, Math.min(C - 1, c + Math.floor(Math.random() * 3) - 1));
      for (let a = 0; a < C; a++) for (const b of edges[s][a]) if ((a < c && b > nc) || (a > c && b < nc)) nc = c;   // 不交叉
      if (!edges[s][c].includes(nc)) edges[s][c].push(nc);
      c = nc;
    }
  }
  // 點的種類
  const count = {}, nodes = [];
  const parents = (s, c) => s === 0 ? [] : [...Array(C).keys()].filter(a => edges[s - 1][a].includes(c));
  for (let s = 0; s < S; s++) {
    nodes.push([]);
    for (let c = 0; c < C; c++) {
      if (!has[s][c]) { nodes[s].push(null); continue; }
      let t = 'monster';
      if (s === S - 1) t = weighted(M.beforeBoss);
      else if (s > 0) for (let tries = 0; tries < 12; tries++) {
        const x = weighted(M.typeWeights);
        if (x === 'elite' && s < M.eliteFromStep - 1) continue;
        if (x === 'heal' && s < M.healFromStep - 1) continue;
        if ((count[x] || 0) >= (M.maxPerMap[x] ?? Infinity)) continue;
        if (x !== 'monster' && parents(s, c).some(a => nodes[s - 1][a] && nodes[s - 1][a].t === x)) continue;   // 同類點不連續
        t = x; break;
      }
      bump(count, t);
      nodes[s].push({ t, jx: Math.random() * 18 - 9, jy: Math.random() * 10 - 5 });
    }
  }
  return { mi, S, C, nodes, edges, pos: null, visited: [] };
}
function availNodes() {
  const m = RUN.mapState;
  if (!m.pos) return m.nodes[0].map((n, l) => n && { s: 0, l }).filter(Boolean);
  if (m.pos.s === m.S - 1) return [{ s: m.S, l: -1 }];        // 王
  if (m.pos.s >= m.S) return [];
  return m.edges[m.pos.s][m.pos.l].map(l => ({ s: m.pos.s + 1, l }));
}
const nodeType = (s, l) => s >= RUN.mapState.S ? 'boss' : RUN.mapState.nodes[s][l].t;

function showMap() {
  showScreen('#mapScreen');
  saveRun();
  const m = RUN.mapState, mp = CONFIG.maps[m.mi];
  $('#mapTitle').textContent = `🗺️ 地圖 ${m.mi + 1}/${CONFIG.maps.length}：${mp.name}・第 ${m.pos ? m.pos.s + 1 : 0}/${m.S + 1} 步`;
  $('#mapParty').innerHTML = partyHTML();
  $('#mapGear').innerHTML = gearHTML();

  // SVG：上面是第 1 步，往下走，最下面是王
  const W = 300, RH = 56, top = 28;
  const X = (s, l) => l < 0 ? W / 2 : 42 + l * (216 / (m.C - 1)) + m.nodes[s][l].jx;
  const Y = (s, l) => top + s * RH + (l < 0 || s >= m.S ? 0 : m.nodes[s][l].jy);
  const H = top + m.S * RH + 34;
  const av = availNodes(), isAv = (s, l) => av.some(a => a.s === s && a.l === l);
  const visited = (s, l) => m.visited.some(v => v.s === s && v.l === l);
  let svg = '';
  const edge = (s1, l1, s2, l2) => { const used = visited(s1, l1) && visited(s2, l2);
    return `<line x1="${X(s1, l1)}" y1="${Y(s1, l1)}" x2="${X(s2, l2)}" y2="${Y(s2, l2)}" stroke="${used ? '#f0c04a' : '#454b58'}" stroke-width="${used ? 4 : 2.5}"/>`; };
  for (let s = 0; s < m.S - 1; s++) for (let l = 0; l < m.C; l++) m.edges[s][l].forEach(l2 => { svg += edge(s, l, s + 1, l2); });
  for (let l = 0; l < m.C; l++) if (m.nodes[m.S - 1][l]) svg += edge(m.S - 1, l, m.S, -1);
  const nodeSvg = (s, l, t) => {
    const cur = m.pos && m.pos.s === s && m.pos.l === l, av1 = isAv(s, l), vis = visited(s, l);
    const r = t === 'boss' ? 24.7 : 18;   // 原本 26 / 19，縮小 5%
    return `<g class="node ${av1 ? 'avail' : ''}" ${av1 ? `data-node="${s},${l}"` : ''} opacity="${av1 || vis ? 1 : .5}">
      <circle cx="${X(s, l)}" cy="${Y(s, l)}" r="${r}" fill="${cur ? '#5a4a1a' : vis ? '#2d3a2f' : '#262a33'}" stroke="${cur ? '#f0c04a' : '#555'}" stroke-width="${cur ? 3 : 1.5}"/>
      <text x="${X(s, l)}" y="${Y(s, l) + 1}" text-anchor="middle" dominant-baseline="middle" font-size="${t === 'boss' ? 22 : 16}">${NODE_ICON[t]}</text></g>`;
  };
  for (let s = 0; s < m.S; s++) {
    svg += `<text x="6" y="${top + s * RH + 4}" fill="#555" font-size="10">${s + 1}</text>`;
    for (let l = 0; l < m.C; l++) if (m.nodes[s][l]) svg += nodeSvg(s, l, m.nodes[s][l].t);
  }
  svg += `<text x="6" y="${top + m.S * RH + 4}" fill="#555" font-size="10">${m.S + 1}</text>` + nodeSvg(m.S, -1, 'boss');
  const el = $('#mapSvg'); el.setAttribute('viewBox', `0 0 ${W} ${H}`); el.innerHTML = svg;
  if (m.pos) setTimeout(() => window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY + (top + m.pos.s * RH) * el.clientWidth / W - 160)), 30);
}
$('#mapSvg').addEventListener('click', e => {
  const g = e.target.closest('[data-node]'); if (!g) return;
  const [s, l] = g.dataset.node.split(',').map(Number);
  enterNode(s, l);
});
function enterNode(s, l) {
  const m = RUN.mapState;
  m.pos = { s, l }; m.visited.push({ s, l });
  const t = nodeType(s, l);
  RUN.history.push(`${m.mi + 1}-${s + 1}${NODE_NAME[t]}`);

    return startBattle({ kind: t, queue: [spec], label: MODES.adventure.label() });
  }
  ({ heal: nodeHeal, buff: nodeBuff, swap: nodeSwap, treasure: nodeTreasure, event: nodeEvent })[t]();
}

const noSwap = `<div class="row"><button onclick="closeModal();showMap()">不換了</button></div>`;

let G = null;
let uidSeq = 0;
function buildPile(counts) {
  const deck = [];
  Object.entries(counts).forEach(([k, n]) => { for (let i = 0; i < n; i++) deck.push({ uid: ++uidSeq, key: k }); });
  return shuffle(deck);
}
function makeMonster(spec) {
  const md = CONFIG.monsters[spec.key];
  const src = [];
  if (spec.pow) src.push({ name: spec.elite ? '區域強度＋精英' : '區域強度', mods: { powAll: spec.pow } });
  if (md.traits) src.push({ name: '特性', mods: { ...md.traits } });
  return {
    idx: 1, isPlayer: false, name: '敵方', title: (spec.elite ? '精英' : '') + md.name, icon: md.icon, key: spec.key,
    role: spec.boss ? '王' : spec.elite ? '精英' : '怪物',
    hp: spec.hp, maxHp: spec.hp, speed: md.speed, deckCounts: { ...md.deck }, deckKeys: Object.keys(md.deck),
    deck: buildPile(md.deck), hand: [], discard: [], slots: Array(CONFIG.slots).fill(null),
    src, roundSrc: [], shield: 0, combo: 0, stats: newStats(), traits: md.traits || {}, turnsAlive: 0,
  };
}
function makePlayerSide() {

  if (c.upNames.length) src.push({ name: '角色提升', mods: c.ups });
  RUN.buffs.forEach(b => src.push({ name: CONFIG.buffs[b.key].name, mods: CONFIG.buffs[b.key].mods }));
  return {
    idx: 0, isPlayer: true, name: '你', title: c.ch.name, char: c,
    hp: c.hp, maxHp: charMaxHp(c), speed: charSpeed(c), deckCounts: { ...c.battle }, deckKeys: Object.keys(c.battle),
    deck: buildPile(c.battle), hand: [], discard: [], slots: Array(CONFIG.slots).fill(null),
    src, roundSrc: [], shield: 0, combo: 0, stats: newStats(), energy: CONFIG.energyPerTurn,
    supports: RUN.party.filter((_, i) => i !== RUN.main).map(sc => ({ name: sc.ch.name, title: sc.ch.name + '（輔助）', deck: buildPile(sc.support), hand: [], discard: [], chosen: null })),
  };
}
// 某個效果欄位的總和，並附上來源（給戰鬥紀錄用）
function modOf(p, key) {
  let n = 0; const t = [];
  [...p.src, ...p.roundSrc].forEach(s => { const v = s.mods[key]; if (v) { n += v; t.push(`${s.name}${sg(v)}`); } });
  return { n, txt: t.join('、') };
}

function drawTo(owner, p, n) {
  while (p.hand.length < n) {
    if (!p.deck.length) {
      if (!p.discard.length) break;
      p.deck = shuffle(p.discard); p.discard = [];
      owner.stats.shuffles++;
      log(`<div class="le sys">${p.title} 牌庫用盡，棄牌堆 ${p.deck.length} 張洗回牌庫。</div>`);
    }
    p.hand.push(p.deck.pop());
  }
}
function newTurn() {
  const [P, E] = G.players;
  G.turn++; G.phase = 'select';
  G.revealed = Array(CONFIG.slots).fill(false);
  G.slotRes = Array(CONFIG.slots).fill(null);
  G.slotPow = Array(CONFIG.slots).fill(null);
  G.slotGlow = Array(CONFIG.slots).fill(null).map(() => [false, false]);
  G.active = -1;
  E.turnsAlive++;
  P.roundSrc = []; E.roundSrc = []; P.shield = 0; E.shield = 0;
  if (E.traits.enrage && E.turnsAlive > 1) E.roundSrc.push({ name: `狂暴×${E.turnsAlive - 1}`, mods: { powAll: E.traits.enrage * (E.turnsAlive - 1) } });
  const e1 = modOf(P, 'energy1');
  P.energy = CONFIG.energyPerTurn + (G.turn === 1 ? e1.n : 0);
  log(`<div class="le turn">— 第 ${G.turn} 回合 — 你 HP ${P.hp} ／ ${E.title} HP ${E.hp}${P.energy > CONFIG.energyPerTurn ? `｜能量 ${P.energy}（${e1.txt}）` : ''}${G.guard ? `｜水晶 ${RUN.crystal}` : ''}</div>`);
  [P, E].forEach(p => { p.slots = Array(CONFIG.slots).fill(null); drawTo(p, p, CONFIG.handSize); });
  P.supports.forEach(s => { s.chosen = null; drawTo(P, s, CONFIG.supportHandSize); });
  aiChoose(E);   // 敵人在回合開始就決定（同時出牌；不會看到你這回合排的牌）
  render();
}

// ---------- 出牌合法性 ----------
const slotCost = p => p.slots.reduce((s, c) => s + (c ? def(c.key).cost : 0), 0);
function orderedPlays(cards, k, energy) {
  const out = [], used = Array(cards.length).fill(false);
  (function rec(cur, cost) {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let i = 0; i < cards.length; i++) {
      if (used[i]) continue;
      const c = def(cards[i].key).cost;
      if (cost + c > energy) continue;
      used[i] = true; cur.push(cards[i]); rec(cur, cost + c); cur.pop(); used[i] = false;
    }
  })([], 0);
  return out;
}
function maxPlayable(cards, energy) {
  const costs = cards.map(c => def(c.key).cost).sort((a, b) => a - b);
  let n = 0, s = 0;
  for (const c of costs) { if (n >= CONFIG.slots || s + c > energy) break; s += c; n++; }
  return n;
}
function lockState(p) {
  const filled = p.slots.filter(Boolean).length;
  const need = maxPlayable([...p.hand, ...p.slots.filter(Boolean)], p.energy);
  if (filled < need) {
    const canAdd = p.slots.includes(null) && p.hand.some(c => slotCost(p) + def(c.key).cost <= p.energy);
    return { ok: false, msg: canAdd ? `點手牌排入格子（還要 ${need - filled} 張）` : `費用超出：這手牌可以排滿 ${need} 張，請調整` };
  }
  const supMissing = p.supports.filter(s => s.hand.length && !s.chosen).length;
  if (supMissing) return { ok: false, msg: `點輔助卡，每位輔助選 1 張（還有 ${supMissing} 位）` };
  return { ok: true, msg: filled < CONFIG.slots ? `手牌費用無法湊滿 ${CONFIG.slots} 張，可留空格` : '' };
}

// ---------- 敵人 AI ----------
function comboLinks(keys) {
  let s = 0;
  for (let i = 1; i < keys.length; i++) {
    const prev = def(keys[i - 1]), cur = def(keys[i]);
    if (cur.combo && cur.combo.cond === 'prevHit' && (prev.type === 'attack' || prev.type === 'skill')) s++;
    if (cur.combo && cur.combo.cond === 'prevBlock' && prev.type === 'defense') s++;
    if (cur.combo && cur.combo.cond === 'prevDodge' && prev.type === 'dodge') s++;
    if (prev.onWinNextAttackBonus && cur.type === 'attack') s++;
  }
  return s;
}
// 對手「還沒出現過的牌」的類型分布（牌庫＋手牌＋已排的牌；看不到哪張在哪）
function unseenTypes(p) { const d = {}; [...p.deck, ...p.hand, ...p.slots.filter(Boolean)].forEach(c => bump(d, def(c.key).type)); return d; }
function aiChoose(p) {
  const energy = CONFIG.energyPerTurn, opp = G.players[1 - p.idx];
  const plays = orderedPlays(p.hand, maxPlayable(p.hand, energy), energy);
  if (!plays.length) return;
  let w;
  if (SET.aiLevel === 'easy') w = plays.map(() => 1);
  else if (SET.aiLevel === 'normal') w = plays.map(pl => 1 + CONFIG.ai.comboWeight * comboLinks(pl.map(c => c.key)));
  else {
    const A = CONFIG.ai.smart, dist = unseenTypes(opp), tot = Object.values(dist).reduce((a, b) => a + b, 0) || 1;
    const pr = t => (dist[t] || 0) / tot;
    const finishing = opp.hp <= A.finishHp, scared = p.hp <= p.maxHp * A.lowHp;
    const val = k => {
      const d = def(k);
      let v;
      if (d.type === 'dodge') v = (pr('attack') + (d.dodgeSkill ? pr('skill') : 0)) * (2 * d.dodgeChance - 1);
      else {
        const loseTo = Object.keys(TYPES).find(t => TYPES[t].beats === d.type);
        v = pr(TYPES[d.type].beats) - pr(loseTo);
        if (d.type !== 'defense') v = v * (0.7 + d.power / 6) + pr(d.type) * (d.power - 2) * 0.1;   // 威力高的攻擊／技巧更值得
      }
      if (finishing && (d.type === 'attack' || d.type === 'skill')) v += 0.25;
      if (scared && (d.type === 'defense' || d.type === 'dodge')) v += 0.25;
      return v;
    };
    const sc = plays.map(pl => pl.reduce((a, c) => a + val(c.key), 0) + A.comboValue * comboLinks(pl.map(c => c.key)));
    const mx = Math.max(...sc);
    w = sc.map(x => Math.exp((x - mx) / A.temperature));
  }
  let r = Math.random() * w.reduce((a, b) => a + b, 0), pick = plays[0];
  for (let i = 0; i < plays.length; i++) { r -= w[i]; if (r <= 0) { pick = plays[i]; break; } }
  pick.forEach((c, i) => { p.slots[i] = c; p.hand.splice(p.hand.indexOf(c), 1); });
}

// =====================================================================
//  結算
// =====================================================================
function newCtx() { return { prev: 'none', breakPen: 0, armed: 0, armedKey: null }; }
function eff(p, key, ok) { const e = p.stats.eff[key] || (p.stats.eff[key] = { ok: 0, miss: 0 }); ok ? e.ok++ : e.miss++; }
const POW_KEY = { attack: 'powAtk', skill: 'powSkl', defense: 'powDef' };

// 計算某方在第 i 格的實際威力（並消耗破防、見切等暫存效果）
function slotPower(pi, i, ctx) {
  const p = G.players[pi], c = p.slots[i], x = ctx[pi];
  const info = { key: c ? c.key : null, base: 0, power: 0, parts: [], notes: [], combo: false };
  if (!c) {
    if (x.armed) { eff(p, x.armedKey, false); info.notes.push(`${def(x.armedKey).name} 效果落空（本格為空）`); x.armed = 0; }
    x.breakPen = 0;
    return info;
  }
  const d = def(c.key);
  let pw = d.power; info.base = pw;
  bump(p.stats.use, c.key);
  if (d.combo) {
    const cn = COND[d.combo.cond];
    if (i > 0 && condMet(d.combo.cond, x.prev)) {
      pw += d.combo.bonus; info.combo = true; info.parts.push(`<span class="ok">+${d.combo.bonus}（${cn} ✓）</span>`); eff(p, c.key, true);
    } else {
      info.notes.push(`<span class="ng">${d.name} 組合落空：${i === 0 ? '位於第 1 格，條件永不成立' : `${cn} ✗（前格${{ hit: '是命中', block: '是擋下', dodge: '是閃避成功' }[x.prev] || '沒有命中、擋下或閃避'}）`}</span>`);
      eff(p, c.key, false);
    }
  }
  if (x.armed) {
    const an = def(x.armedKey).name;
    if (d.type === 'attack') { pw += x.armed; info.combo = true; info.parts.push(`<span class="ok">+${x.armed}（${an} 效果 ✓）</span>`); eff(p, x.armedKey, true); }
    else { info.notes.push(`<span class="ng">${an} 效果落空：本格不是攻擊卡</span>`); eff(p, x.armedKey, false); }
    x.armed = 0;
  }
  if (d.type !== 'dodge') {
    const keys = ['powAll', POW_KEY[d.type]];
    if (i === 0) keys.push('slot1');
    if (p.hp <= p.maxHp / 2) keys.push('lowHpPow');
    keys.forEach(k => { const m = modOf(p, k); if (m.n) { pw += m.n; info.parts.push(`${sg(m.n)}（${m.txt}）`); } });
  }
  if (x.breakPen) { pw -= x.breakPen; info.parts.push(`<span class="ng">−${x.breakPen}（被破防）</span>`); x.breakPen = 0; }
  info.power = Math.max(0, pw);
  return info;
}

// 決定勝負：回傳 { w: 0|1|null, how, roll?, need? }
function decide(a, b) {
  const P = G.players;
  const ta = a.key && def(a.key).type, tb = b.key && def(b.key).type;
  if (!ta && !tb) return { w: null, how: 'bothEmpty' };
  if (ta === 'dodge' || tb === 'dodge') {
    if (ta === tb) return { w: null, how: 'dodgeBoth' };
    const di = ta === 'dodge' ? 0 : 1, ot = di === 0 ? tb : ta, dd = def((di === 0 ? a : b).key);
    if (!ot || ot === 'defense') return { w: null, how: 'dodgeIdle' };
    if (ot === 'attack' || dd.dodgeSkill) {
      const roll = Math.floor(Math.random() * 100) + 1, need = Math.min(95, Math.round(dd.dodgeChance * 100) + modOf(P[di], 'dodge').n);
      return roll <= need ? { w: di, how: 'dodge', roll, need } : { w: 1 - di, how: 'dodgeFail', roll, need };
    }
    return { w: 1 - di, how: 'vsDodge' };
  }
  if (!ta || !tb) {
    const w = ta ? 0 : 1, t = ta || tb;
    return t === 'defense' ? { w: null, how: 'emptyDef' } : { w, how: 'empty' };
  }
  if (TYPES[ta].beats === tb) return { w: 0, how: 'triangle' };
  if (TYPES[tb].beats === ta) return { w: 1, how: 'triangle' };
  if (ta === 'defense') return { w: null, how: 'defdef' };
  if (ta === 'attack' && CONFIG.attackClash === 'mutual') return { w: null, how: 'mutual' };
  if (ta === 'attack' && CONFIG.attackClash === 'diff') {
    if (a.power === b.power) return { w: null, how: 'diffTie' };
    return { w: a.power > b.power ? 0 : 1, how: 'diff' };
  }
  if (a.power !== b.power) return { w: a.power > b.power ? 0 : 1, how: 'power' };
  if (P[0].speed !== P[1].speed) return { w: P[0].speed > P[1].speed ? 0 : 1, how: 'speed' };
  return { w: null, how: 'tie' };
}

// 造成傷害：護甲、護盾 → 扣血 → 特效
function dealDamage(W, L, key, dmg) {
  const notes = [];
  const armor = modOf(L, 'armor');
  if (armor.n > 0 && dmg > 0) { const nd = Math.max(1, dmg - armor.n); if (nd < dmg) notes.push(`護甲 −${dmg - nd}（${armor.txt}）`); dmg = nd; }
  if (L.shield > 0 && dmg > 0) { const a = Math.min(L.shield, dmg); L.shield -= a; dmg -= a; notes.push(`護盾吸收 ${a}`); fxFloat(L.idx, `🛡${a}`, 'shield', 16); }
  const before = L.hp;
  L.hp = Math.max(0, L.hp - dmg);
  if (key) bump(W.stats.dmg, key, dmg);
  W.stats.dmgDealt += dmg;
  L.stats.dmgTaken += dmg;
  if (dmg > 0) { G.flash.push(L.idx); fxFloat(L.idx, `−${dmg}`, 'dmg', Math.min(52, 18 + dmg * 3)); fxShake(dmg); }
  return { dmg, before, notes };
}
function healSide(p, n) {
  const got = Math.max(0, Math.min(n, p.maxHp - p.hp));
  p.hp += got;
  if (got > 0) fxFloat(p.idx, `+${got}`, 'heal', 20);
  return got;
}
// 命中：連擊數 +1、連擊加傷、吸血、荊棘
function applyHit(W, L, key, base, ctx) {
  ctx[W.idx].prev = 'hit'; W.stats.hits++;
  W.combo++; G.comboPop.push(W.idx);
  if (W.isPlayer) RUN.maxCombo = Math.max(RUN.maxCombo, W.combo);
  const extra = [];
  let dmg = base;
  const cd = modOf(W, 'comboDmg');
  if (cd.n && W.combo >= 2) { dmg += cd.n * (W.combo - 1); extra.push(`${W.combo} 連擊 +${cd.n * (W.combo - 1)}（${cd.txt}）`); }
  const h = dealDamage(W, L, key, dmg);
  const ls = modOf(W, 'lifesteal');
  if (ls.n && h.dmg > 0) { const g = healSide(W, ls.n); if (g) extra.push(`吸血回復 ${g}`); }
  const th = modOf(L, 'thorns');
  if (th.n) { const t = dealDamage(L, W, null, th.n); extra.push(`荊棘反彈 ${t.dmg}（${th.txt}）→ ${W.name} HP ${t.before} → ${W.hp}`); }
  return { ...h, extra: [...h.notes, ...extra] };
}

function powerLine(p, info) {
  if (!info.key) return `<div>${p.name}：<span class="note">（空格）</span></div>`;
  if (def(info.key).type === 'dodge') return `<div>${p.name}：${cardLabel(info.key)}</div>`;
  const tail = info.parts.length ? `${info.base} ${info.parts.join(' ')} = <b>${info.power}</b>` : `<b>${info.power}</b>`;
  return `<div>${p.name}：${cardLabel(info.key)} 威力 ${tail}</div>`;
}

function resolveSlot(i, ctx) {
  const P = G.players;
  const infos = [slotPower(0, i, ctx), slotPower(1, i, ctx)];
  const r = decide(infos[0], infos[1]);
  G.slotPow[i] = [infos[0].power, infos[1].power];
  G.slotGlow[i] = [infos[0].combo, infos[1].combo];
  infos.forEach((inf, pi) => { if (inf.combo) fxFloat(pi, '組合！', 'info', 16); });
  const lines = [`<b>第 ${i + 1} 格</b>`, powerLine(P[0], infos[0]), powerLine(P[1], infos[1])];
  infos.forEach(inf => inf.notes.forEach(n => lines.push(`<div class="note">${n}</div>`)));
  const T = key => TYPES[def(key).type].label;
  const hitBy = [false, false];

  let why = '', res = '', badge = { text: '無事', cls: 'none' };
  ctx[0].prev = ctx[1].prev = 'none';
  const defWin = r.how === 'triangle' && def(infos[r.w].key).type === 'defense' ? r.w : -1;
  infos.forEach((inf, pi) => { if (inf.key && pi !== defWin) { const d = def(inf.key); if (d.counterOnWin != null || d.onWinNextAttackBonus) eff(P[pi], inf.key, false); } });
  const brkWin = r.how === 'triangle' && def(infos[r.w].key).type === 'skill' ? r.w : -1;
  infos.forEach((inf, pi) => { if (inf.key && def(inf.key).breakOnWin) eff(P[pi], inf.key, pi === brkWin); });
  const ext = h => h.extra.length ? `（${h.extra.join('；')}）` : '';

  if (r.how === 'mutual') {
    why = `同為攻擊 → 互相傷害（威力 ${infos[0].power} 對 ${infos[1].power}）`;
    bump(G.matchups, '攻擊對攻擊（互相傷害）');
    const h0 = applyHit(P[0], P[1], infos[0].key, infos[0].power, ctx);
    const h1 = applyHit(P[1], P[0], infos[1].key, infos[1].power, ctx);
    hitBy[0] = hitBy[1] = true;
    res = `→ 雙方互相命中！${P[1].name}受到 ${h0.dmg}${ext(h0)}，HP ${h0.before} → ${P[1].hp}；${P[0].name}受到 ${h1.dmg}${ext(h1)}，HP ${h1.before} → ${P[0].hp}`;
    badge = { text: `互相命中<br>你 −${h1.dmg}・敵 −${h0.dmg}`, cls: 'mutual' };
  } else if (r.w === null) {
    const t = infos[0].key ? T(infos[0].key) : '';
    why = {
      bothEmpty: '雙方皆為空格', emptyDef: '一方空格、另一方是防禦 → 無事', defdef: '防禦對防禦 → 一律無事',
      tie: `同為${t}，威力相同（${infos[0].power}）且速度相同（${P[0].speed}）→ 雙方無事`,
      diffTie: `同為攻擊，威力相同（${infos[0].power}）→ 高減低為 0，雙方無事`,
      dodgeBoth: '雙方都閃避 → 無事', dodgeIdle: '閃避對上防禦或空格 → 無事',
    }[r.how];
    res = '→ 雙方無事';
    bump(G.matchups, { defdef: '防禦對防禦（無事）', tie: '同類平手（無事）', diffTie: '攻擊對攻擊（威力相同，無事）', dodgeBoth: '閃避（無事）', dodgeIdle: '閃避（無事）' }[r.how] || '空格（無事）');
  } else {
    const W = P[r.w], L = P[1 - r.w], wi = infos[r.w], li = infos[1 - r.w], wd = def(wi.key), x = ctx[r.w];
    if (r.how === 'triangle') { why = `${T(wi.key)} 勝 ${T(li.key)}（相剋）`; bump(G.matchups, why); }
    else if (r.how === 'power') { why = `同為${T(wi.key)}，比威力：${wi.power} > ${li.power}`; bump(G.matchups, '同類比威力'); }
    else if (r.how === 'speed') { why = `同為${T(wi.key)}且威力相同（${wi.power}），比速度：${W.speed} > ${L.speed}`; bump(G.matchups, '同類比速度'); }
    else if (r.how === 'diff') { why = `同為攻擊，高減低：${wi.power} − ${li.power} = ${wi.power - li.power}`; bump(G.matchups, '攻擊對攻擊（高減低）'); }
    else if (r.how === 'dodge') { why = `${L.name}出${T(li.key)}，${W.name}閃避擲骰 🎲 ${r.roll}（≤ ${r.need} 成功）`; bump(G.matchups, '閃避成功'); }
    else if (r.how === 'dodgeFail') { why = `${W.name}出${T(wi.key)}，${L.name}閃避擲骰 🎲 ${r.roll}（> ${r.need} 失敗）`; bump(G.matchups, '閃避失敗'); }
    else if (r.how === 'vsDodge') { why = `技巧對閃避（這張閃避躲不了技巧）→ 命中`; bump(G.matchups, '技巧命中閃避'); }
    else { why = `${L.name} 空格，${W.name} 直接命中`; bump(G.matchups, '對空格命中'); }

    if (r.how === 'dodge') {
      x.prev = 'dodge'; W.stats.dodges++; eff(W, wi.key, true);
      fxFloat(W.idx, '閃避！', 'info', 20);
      res = `→ ${W.name}閃避成功！完全不受傷`;
      badge = { text: `${W.name}閃避成功<br>🎲 ${r.roll}`, cls: 'win' + r.w };
    } else if (wd.type === 'defense') {
      const parts = [];
      const base = wd.counterOnWin != null ? wd.counterOnWin : CONFIG.baseCounter;
      parts.push(wd.counterOnWin != null ? `${wd.name} 反擊 ${base}` : `基本反擊 ${base}`);
      let dmg = base;
      if (wd.counterOnWin != null) eff(W, wi.key, true);
      const cm = modOf(W, 'counter');
      if (cm.n) { dmg += cm.n; parts.push(cm.txt); }
      if (wd.onWinNextAttackBonus) {
        x.armed = wd.onWinNextAttackBonus; x.armedKey = wi.key;
        parts.push(`<span class="ok">${wd.name}：下一格攻擊卡威力 +${wd.onWinNextAttackBonus}</span>`);
      }
      x.prev = 'block'; W.stats.blocks++;
      fxFloat(W.idx, '擋下！', 'info', 20);
      const h = dealDamage(W, L, wi.key, dmg);
      res = `→ ${W.name}擋下！不受傷，反擊 ${h.dmg} 傷害（${[...parts, ...h.notes].join('，')}）。${L.name} HP ${h.before} → ${L.hp}`;
      badge = { text: `${W.name}擋下<br>反擊 ${dmg}${h.dmg < dmg ? `（實際 ${h.dmg}）` : ''}`, cls: 'win' + r.w };
    } else {
      if (r.how === 'dodgeFail') eff(L, li.key, false);
      const base = r.how === 'diff' ? wi.power - li.power : wi.power;
      const h = applyHit(W, L, wi.key, base, ctx);
      hitBy[r.w] = true;
      res = `→ ${W.name}命中！${L.name}受到 ${h.dmg} 傷害（${r.how === 'diff' ? '威力差' : '威力'} ${base}${h.extra.length ? '；' + h.extra.join('；') : ''}）`;
      badge = { text: `${W.name}命中<br>−${h.dmg}${h.dmg < base ? `（${base}）` : ''}${W.combo >= 2 ? `<br>${W.combo} 連擊` : ''}${r.how === 'dodgeFail' ? '<br>閃避失敗' : ''}`, cls: 'win' + r.w };
      if (wd.type === 'skill' && r.how === 'triangle') {
        const brk = wd.breakOnWin || CONFIG.breakPenalty;
        ctx[1 - r.w].breakPen += brk; W.stats.breaks++;
        res += `，並且<span class="ng">破防</span>：${L.name}下一格威力 −${brk}${wd.breakOnWin ? `（${wd.name}）` : ''}`;
        badge.text += '<br>破防';
      }
      res += `。${L.name} HP ${h.before} → ${L.hp}`;
    }
  }
  // 連擊：命中 +1（在 applyHit 裡）；擋下、閃避成功維持；其他情況中斷
  P.forEach((p, pi) => {
    if (hitBy[pi] || ctx[pi].prev === 'block' || ctx[pi].prev === 'dodge') return;
    if (p.combo >= 2) { lines.push(`<div class="note">${p.name}的 ${p.combo} 連擊中斷</div>`); fxFloat(pi, '連擊中斷', 'info', 13); }
    p.combo = 0;
  });
  lines.push(`<div class="why">⚖ ${why}</div>`, `<div class="res">${res}</div>`);
  if (P[0].combo >= 2) lines.push(`<div class="ok">🔥 ${P[0].combo} 連擊</div>`);
  log(`<div class="le">${lines.join('')}</div>`);
  G.slotRes[i] = badge;
  checkOver();
}
// 判斷勝負；守護模式下敵人倒下但還有排隊的，就標記換下一隻
function checkOver() {
  const [P, E] = G.players;
  if (E.hp <= 0) {
    if (P.hp <= 0) { P.hp = 1; log(`<div class="le sys">同歸於盡的一擊！你以 1 HP 撐住了。</div>`); }
    if (G.queue.length) { G.pendingSpawn = true; return; }
    G.over = true; G.winner = 0;
  } else if (P.hp <= 0) { G.over = true; G.winner = 1; }
}

// 輔助卡：掀開並套用（本回合效果放進 roundSrc）
function applySupport(s) {
  const [P, E] = G.players, card = sdef(s.chosen.key), m = card.mods, out = [];
  bump(P.stats.sup, s.chosen.key);
  if (m.heal) out.push(`回復 ${healSide(P, m.heal)}（HP ${P.hp}）`);
  if (m.shield) { P.shield += m.shield; out.push(`護盾 +${m.shield}`); fxFloat(0, `🛡+${m.shield}`, 'shield', 18); }
  if (m.dmg) { const h = dealDamage(P, E, null, m.dmg); P.stats.supDmg += h.dmg; out.push(`直接造成 ${h.dmg} 傷害${h.notes.length ? `（${h.notes.join('；')}）` : ''}，${E.title} HP ${h.before} → ${E.hp}`); }
  if (m.selfDmg) { const b = P.hp; P.hp = Math.max(1, P.hp - m.selfDmg); if (b > P.hp) fxFloat(0, `−${b - P.hp}`, 'dmg', 20); out.push(`自己失去 ${b - P.hp} HP`); }
  if (m.weaken) { E.roundSrc.push({ name: card.name, mods: { powAll: -m.weaken } }); out.push(`敵方本回合所有威力 −${m.weaken}`); }
  const buff = {};
  ['powAll', 'powAtk', 'powSkl', 'powDef', 'slot1', 'counter', 'dodge'].forEach(k => { if (m[k]) buff[k] = m[k]; });
  if (Object.keys(buff).length) { P.roundSrc.push({ name: card.name, mods: buff }); out.push(`本回合 ${modText(buff)}`); }
  log(`<div class="le sup">🤝 輔助｜${s.name}：${supLabel(s.chosen.key)} → ${out.join('；')}</div>`);
}

async function reveal() {
  G.phase = 'reveal';
  const g = G, P = G.players[0];
  const ctx = [newCtx(), newCtx()];
  log(`<div class="le sys">鎖定。你：${P.slots.map(c => c ? def(c.key).name : '空').join(' → ')}${P.supports.length ? `｜輔助：${P.supports.map(s => s.chosen ? sdef(s.chosen.key).name : '無').join('、')}` : ''}</div>`);
  // 輔助卡先掀開
  const sups = P.supports.filter(s => s.chosen);
  if (sups.length) {
    G.supFlip = true; render(); G.supFlip = false;
    for (const s of sups) {
      await sleep(CONFIG.ui.supportDelay); if (G !== g) return;
      applySupport(s); s.glow = true; checkOver(); render(); s.glow = false;
      if (G.pendingSpawn) {   // 輔助打倒了敵人：下一隻上場，馬上決定這回合的出牌
        G.pendingSpawn = false; spawnNext(); aiChoose(G.players[1]); render();
        await sleep(CONFIG.ui.supportDelay); if (G !== g) return;
      }
      if (G.over) break;
    }
    await sleep(CONFIG.ui.supportDelay); if (G !== g) return;
  }
  if (!G.over) for (let i = 0; i < CONFIG.slots; i++) {
    G.active = i; G.revealed[i] = true; G.anim = i; render();
    await sleep(CONFIG.ui.flipDelay); if (G !== g) return;
    resolveSlot(i, ctx); render();
    if (G.over) break;
    if (G.pendingSpawn) {
      if (i < CONFIG.slots - 1) log(`<div class="le sys">敵人倒下，本回合剩下的格子作廢。</div>`);
      G.pendingSpawn = false;
      await sleep(CONFIG.ui.slotDelay); if (G !== g) return;
      G.players[1].slots.forEach(c => c && G.players[1].discard.push(c));
      spawnNext(); render();
      break;
    }
    await sleep(CONFIG.ui.slotDelay); if (G !== g) return;
  }
  const E = G.players[1];
  if (!G.over) {
    ctx.forEach((x, pi) => { if (x.armed) { eff(G.players[pi], x.armedKey, false); log(`<div class="le sys">${G.players[pi].name}的 ${def(x.armedKey).name} 效果落空（已是最後一格）</div>`); } });
    [P, E].forEach(p => { const rg = modOf(p, 'regen'); if (rg.n) { const got = healSide(p, rg.n); if (got) log(`<div class="le sys">${p.title} 回復 ${got}（${rg.txt}），HP ${p.hp}</div>`); } });
    // 守護：排隊中的敵人攻擊水晶
    if (G.guard && G.queue.length) {
      const d = G.queue.length * CONFIG.guard.siegeDmg, b = RUN.crystal;
      RUN.crystal = Math.max(0, RUN.crystal - d);
      fxFloat('crystal', `−${b - RUN.crystal}`, 'crystal', 22);
      log(`<div class="le siege">🔮 排隊中的 ${G.queue.length} 隻敵人攻擊水晶：${b} → ${RUN.crystal}</div>`);
      if (RUN.crystal <= 0) { G.over = true; G.winner = 1; G.loseReason = '水晶被摧毀'; }
    }
  }
  [P, E].forEach(p => { p.slots.forEach(c => c && p.discard.push(c)); p.slots = Array(CONFIG.slots).fill(null); });
  P.supports.forEach(s => { if (s.chosen) s.discard.push(s.chosen); });
  G.active = -1;
  if (G.over) {
    G.phase = 'over';
    if (G.winner === 0) G.beaten.push(E.title), RUN.kills++;
    log(`<div class="le turn">${G.winner === 0 ? `擊敗 ${E.title}！` : G.loseReason ? `🔮 ${G.loseReason}……` : `${P.title} 倒下了……`}（第 ${G.turn} 回合）</div>`);
  } else G.phase = 'end';
  render();
}

// ---------- 戰鬥結束 ----------
function finishBattle() {
  const P = G.players[0];
  mainChar().hp = P.hp;
  mergeStats(RUN.stats, P.stats);
  RUN.buffs.forEach(b => b.left--);
  RUN.buffs = RUN.buffs.filter(b => b.left > 0);
  MODES[RUN.mode].battleEnd(G.winner === 0);
}

// =====================================================================
//  特效（畫面回饋）
// =====================================================================
function fxFloat(target, text, cls, size) {
  if ($('#gameScreen').classList.contains('hidden')) return;
  const f = target === 'crystal' ? $('#crystalIcon') : $('#fighter' + target);
  if (!f) return;
  const fr = f.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = `float ${cls}`; el.textContent = text; el.style.fontSize = size + 'px'; el.style.position = 'fixed';
  el.style.left = (fr.left + fr.width / 2 + (Math.random() * 24 - 12)) + 'px';
  el.style.top = (fr.top + fr.height * (target === 'crystal' ? 0.5 : 0.4) + (Math.random() * 30 - 15)) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}
function fxShake(dmg) {
  if (dmg < CONFIG.ui.bigHit) return;
  const w = $('#arenaWrap'); w.classList.remove('shake1', 'shake2'); void w.offsetWidth;
  w.classList.add(dmg >= CONFIG.ui.bigHit * 2 ? 'shake2' : 'shake1');
  if (SET.vibrate && navigator.vibrate) try { navigator.vibrate(dmg >= CONFIG.ui.bigHit * 2 ? [60, 40, 90] : 50); } catch (e) {}
}

// =====================================================================
//  戰鬥介面
// =====================================================================
function log(html) { const el = $('#log'); el.insertAdjacentHTML('beforeend', html); el.scrollTop = el.scrollHeight; }
function hpBoxHTML(p) {
  const pct = Math.max(0, p.hp / p.maxHp * 100);
  return `<div class="hpbox" style="grid-column:${p.idx === 0 ? 2 : 3}">HP ${p.hp}/${p.maxHp}${p.shield ? ` 🛡${p.shield}` : ''}
    <div class="hpwrap"><div class="hpfill ${pct <= 30 ? 'low' : ''}" style="width:${pct}%"></div></div></div>`;
}
function fighterHTML(p) {
  const combo = p.combo >= 2 ? `<div class="combo ${G.comboPop.includes(p.idx) ? 'pop' : ''}" style="font-size:${Math.min(20, 9 + p.combo * 2)}px">${p.combo} 連擊</div>` : '';
  const tr = p.isPlayer ? '' : modText(p.traits).replace(/，/g, '<br>');
  return `<div id="fighter${p.idx}" class="fighter ${p.isPlayer ? 'me' : 'op'} ${G.flash.includes(p.idx) ? 'flash' : ''} ${p.hp <= 0 ? 'dead' : ''} ${!p.isPlayer && G.enter ? 'enter' : ''}" onclick="showFighter(${p.idx})">${combo}
    <div class="glyph">${p.isPlayer ? p.title[0] : p.icon}</div><div class="fn">${p.isPlayer ? '主角' : p.role}</div>
    <div class="fn">${p.isPlayer ? p.title : p.title.replace('精英', '')}</div><div class="fn">速 ${p.speed}</div>${tr ? `<div class="tr">${tr}</div>` : ''}</div>`;
}
function render() {
  if (!G) return;
  const [me, op] = G.players;
  $('#turnLbl').textContent = `${G.label}・第 ${G.turn} 回合`;
  $('#speedBtn').textContent = SET.fast ? '速度 快' : '速度 1x';

  // 守護：水晶與排隊的敵人
  const gb = $('#guardBar');
  gb.classList.toggle('hidden', !G.guard);
  if (G.guard) gb.innerHTML = `<span id="crystalIcon">🔮</span><b>水晶 ${RUN.crystal}/${RUN.crystalMax}</b>
    <span class="gq">${G.queue.length ? `排隊 ${G.queue.map(s => CONFIG.monsters[s.key].icon).join('')} <span class="muted" style="font-size:11px">每回合 −${G.queue.length * CONFIG.guard.siegeDmg}</span>` : '<span class="muted" style="font-size:11px">最後一隻</span>'}</span>`;

  let b = `<div class="colhdr" style="grid-column:1;grid-row:1"><b>我方出牌</b><br>庫 ${me.deck.length}・棄 ${me.discard.length}</div>
    ${hpBoxHTML(me)}${hpBoxHTML(op)}
    <div class="colhdr" style="grid-column:4;grid-row:1"><b>敵方出牌</b><br>手 ${op.hand.length}・庫 ${op.deck.length}・棄 ${op.discard.length}</div>
    ${fighterHTML(me)}${fighterHTML(op)}`;
  for (let i = 0; i < CONFIG.slots; i++) {
    const oc = op.slots[i], mc = me.slots[i], rv = G.revealed[i], pw = G.slotPow[i], row = i + 2, act = G.active === i ? 'active' : '';
    const gl = G.slotGlow[i] || [false, false];
    const tag = on => on ? `<span class="ctag">組合！</span>` : '';
    let oHTML;
    if (!rv) {
      const it = SET.intent && i === 0 && oc ? def(oc.key).type : null;   // 意圖預告：公開第 1 格的類型
      oHTML = oc || G.phase === 'select' ? `<div class="card back">${it ? `<span class="intent ${TYPES[it].cls}">${TYPES[it].label}?</span>` : '?'}</div>` : `<div class="card empty">空</div>`;
    } else oHTML = oc ? cardHTML(oc.key, (G.anim === i ? 'flip ' : '') + (gl[1] ? 'glow' : ''), (pw ? `<span class="final">${pw[1]}</span>` : '') + tag(gl[1])) : `<div class="card empty">空</div>`;
    const mHTML = mc ? cardHTML(mc.key, gl[0] ? 'glow' : '', (pw ? `<span class="final">${pw[0]}</span>` : '') + tag(gl[0])) : `<div class="card empty">${G.phase === 'select' ? `第 ${i + 1} 格` : '空'}</div>`;
    b += `<div class="slot ${act}" data-slot="${i}" style="grid-column:1;grid-row:${row}">${mHTML}</div>
      <div class="slot ${act}" style="grid-column:4;grid-row:${row}">${oHTML}</div>`;
    const res = G.slotRes[i];
    if (res) b += `<div class="badge rowbadge ${res.cls}" style="grid-row:${row}">${res.text}</div>`;
  }
  $('#board').innerHTML = b;
  G.anim = -1; G.flash = []; G.comboPop = []; G.enter = false;

  // 輔助：選牌時顯示手牌，鎖定後只顯示掀開的那張
  $('#supports').innerHTML = me.supports.map((s, si) => {
    let cards;
    if (G.phase === 'select') cards = s.hand.map(c => `<div data-sup="${si}" data-suid="${c.uid}">${supCardHTML(c.key, s.chosen === c ? 'sel' : '')}</div>`).join('');
    else cards = s.chosen ? `<div style="grid-column: span 4">${supCardHTML(s.chosen.key, (G.supFlip ? 'flip ' : '') + (s.glow ? 'glow' : ''))}</div>` : `<div class="card empty" style="grid-column: span 4">沒有出牌</div>`;
    return `<div class="suprow"><div class="supname">${s.name}<small>輔助</small></div>${cards}</div>`;
  }).join('');

  const used = slotCost(me), left = me.energy - used;
  $('#energy').innerHTML = `能量 <b>${'●'.repeat(Math.max(0, left))}${'○'.repeat(Math.max(0, used))}</b> ${left}/${me.energy}`;
  $('#hand').innerHTML = me.hand.map(c => {
    const dim = G.phase !== 'select' || def(c.key).cost > left || !me.slots.includes(null);
    return `<div data-uid="${c.uid}">${cardHTML(c.key, dim ? 'dim' : '')}</div>`;
  }).join('');

  const btn = $('#actBtn'), hint = $('#hint');
  if (G.phase === 'select') {
    const ls = lockState(me);
    btn.disabled = !ls.ok; btn.textContent = '鎖定出牌'; hint.textContent = ls.msg || '點格子中的卡可收回';
  } else if (G.phase === 'reveal') { btn.disabled = true; btn.textContent = '翻牌結算中…'; hint.textContent = ''; }
  else if (G.phase === 'end') { btn.disabled = false; btn.textContent = '下一回合 ▶'; hint.textContent = '可往下查看戰鬥紀錄'; }
  else { btn.disabled = false; btn.textContent = G.winner === 0 ? '繼續 ▶' : '查看結果'; hint.textContent = G.winner === 0 ? '勝利！' : (G.loseReason || '主角倒下了'); }
}

$('#hand').addEventListener('click', e => {
  const el = e.target.closest('[data-uid]'); if (!el || !G || G.phase !== 'select') return;
  const me = G.players[0], c = me.hand.find(c => c.uid === +el.dataset.uid);
  const si = me.slots.indexOf(null);
  if (si < 0) return toast('三格已滿，點格子中的卡可收回');
  if (slotCost(me) + def(c.key).cost > me.energy) return toast('能量不足');
  me.hand.splice(me.hand.indexOf(c), 1); me.slots[si] = c; render();
});
$('#board').addEventListener('click', e => {
  const el = e.target.closest('[data-slot]'); if (!el || !G || G.phase !== 'select') return;
  const me = G.players[0], i = +el.dataset.slot;
  if (me.slots[i]) { me.hand.push(me.slots[i]); me.slots[i] = null; render(); }
});
$('#supports').addEventListener('click', e => {
  const el = e.target.closest('[data-suid]'); if (!el || !G || G.phase !== 'select') return;
  const s = G.players[0].supports[+el.dataset.sup], c = s.hand.find(c => c.uid === +el.dataset.suid);
  s.chosen = s.chosen === c ? null : c;
  render();

    if (v < 0 || v > CONFIG.maxCopies || (+b.dataset.dd > 0 && deckCount(edit.d) >= K.max())) return;

    const top = $('#modal').scrollTop; renderDeckEditor(); $('#modal').scrollTop = top;
  } else if (b.dataset.dact === 'reset') { edit.d = K.def(edit.charKey); renderDeckEditor(); }
  else if (b.dataset.dact === 'clear') { edit.d = {}; renderDeckEditor(); }
  else if (b.dataset.dact === 'done' && deckValid(edit.kind, edit.charKey, edit.d)) {
    savedDecks[edit.kind][edit.charKey] = edit.d; store('cardDuel.decks2', savedDecks); edit = null; closeModal(); showDecks();
  }
});

// 遊戲設定
function showSettings() {
  const row = (label, key, opts) => `<div class="optrow"><div class="lbl">${label}</div>${Object.entries(opts).map(([v, t]) =>
    `<button class="${String(SET[key]) === v ? 'sel' : ''}" onclick="setOpt('${key}','${v}')">${t}</button>`).join('')}</div>`;
  openModal(`<h3>⚙️ 遊戲設定</h3>
    ${row('敵人 AI', 'aiLevel', { easy: '簡單', normal: '普通', smart: '聰明' })}
    <div class="muted" style="font-size:11px;margin:-6px 0 10px">${AI_LEVEL[SET.aiLevel]}${SET.aiLevel === 'smart' ? '：會根據你還沒出現過的牌推算你可能出的類型，出剋制的牌；你血少時會積極進攻' : ''}</div>
    ${row('攻擊對攻擊', 'attackClash', CLASH)}
    ${row('怪物意圖預告（先公開敵方第 1 格的類型）', 'intent', { true: '開', false: '關' })}
    ${row('翻牌速度', 'fast', { false: '一般', true: '快速' })}
    ${row('大傷害時手機震動', 'vibrate', { true: '開', false: '關' })}
    <div class="row"><button class="pri" onclick="closeModal()">完成</button></div>`);
}
function setOpt(key, v) { SET[key] = v === 'true' ? true : v === 'false' ? false : v; saveSettings(); showSettings(); }

goHome();
</script>
